<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wizardo Cloud</title><style>
:root{font:15px system-ui;color:#1d2433;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.top{height:68px;background:#fff;border-bottom:1px solid #e4e8f0;display:flex;align-items:center;padding:0 28px;gap:14px}.logo{font-size:22px;font-weight:750;color:#635bff}.logo span{color:#1d2433}.actions{margin-left:auto;display:flex;gap:10px}button,.upload{border:0;border-radius:9px;padding:10px 15px;background:#635bff;color:#fff;font-weight:650;cursor:pointer}.secondary{background:#eef0ff;color:#5149d9}.wrap{max-width:1100px;margin:34px auto;padding:0 24px}.welcome{display:flex;align-items:end;justify-content:space-between;margin-bottom:25px}.welcome h1{margin:0 0 7px;font-size:29px}.muted{color:#788198}.crumb{color:#635bff;font-weight:600;margin:18px 0}.card{background:#fff;border:1px solid #e7eaf1;border-radius:14px;overflow:hidden;box-shadow:0 5px 20px #2d3b6710}.row{display:grid;grid-template-columns:1fr 150px 170px 100px;align-items:center;padding:14px 20px;border-bottom:1px solid #eef0f5;gap:15px}.row:last-child{border:0}.head{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#8b93a6;background:#fafbfc}.name{font-weight:600;display:flex;gap:11px;align-items:center}.icon{font-size:21px}.empty{text-align:center;padding:65px;color:#8b93a6}.drop{border:2px dashed #d5d9ff;border-radius:12px;padding:22px;text-align:center;margin:20px 0;color:#636c80}.drop.drag{background:#f0efff;border-color:#635bff}.danger{color:#dd4d68;background:none;padding:5px}.mobile-hide{text-align:right}@media(max-width:700px){.row{grid-template-columns:1fr 90px}.head .mobile-hide,.row .mobile-hide{display:none}.wrap{margin:20px auto}.welcome{display:block}.actions{margin-top:15px}}
</style></head><body><header class="top"><div class="logo">🪄 <span>Wizardo</span></div><div class="muted">Cloud desktop</div><div class="actions"><label class="upload">Upload<input id="file" type="file" multiple hidden></label><button class="secondary" id="new">New folder</button></div></header><main class="wrap"><div class="welcome"><div><h1>My files</h1><div class="muted">Your private space, available anywhere.</div></div></div><div class="crumb" id="crumb">Home</div><div id="drop" class="drop">Drop files here to upload</div><section class="card"><div class="row head"><div>Name</div><div>Size</div><div>Modified</div><div class="mobile-hide">Actions</div></div><div id="list"><div class="empty">Loading your files…</div></div></section></main><script>
let current='';const list=document.querySelector('#list'),crumb=document.querySelector('#crumb');const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const format=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';
async function load(){const r=await fetch('/api/files'+(current?'/'+encodeURI(current):''));if(!r.ok){list.innerHTML='<div class="empty">Could not load this folder.</div>';return}const files=await r.json();crumb.textContent='Home'+(current?' / '+current:'');list.innerHTML=files.length?files.map(f=>`<div class="row"><div class="name"><span class="icon">${f.kind==='directory'?'📁':'📄'}</span><a href="#" data-path="${esc(f.path)}" data-kind="${f.kind}">${esc(f.name)}</a></div><div>${f.kind==='file'?format(f.size):'—'}</div><div class="muted">${new Date(f.modified).toLocaleDateString()}</div><div class="mobile-hide"><button class="danger" data-delete="${esc(f.path)}">Delete</button></div></div>`).join(''):'<div class="empty">This folder is empty.</div>';}
list.onclick=e=>{const a=e.target.closest('a');if(a){e.preventDefault();if(a.dataset.kind==='directory'){current=a.dataset.path;load()}else location='/api/files/'+encodeURI(a.dataset.path)}const d=e.target.closest('[data-delete]');if(d&&confirm('Delete this item?'))fetch('/api/files/'+encodeURI(d.dataset.delete),{method:'DELETE'}).then(load)};
document.querySelector('#file').onchange=e=>[...e.target.files].forEach(async f=>{await fetch('/api/files/'+encodeURI(current?current+'/'+f.name:f.name),{method:'PUT',body:f});load()});document.querySelector('#new').onclick=async()=>{const n=prompt('Folder name');if(n){await fetch('/api/files/'+encodeURI(current?current+'/'+n:n),{method:'POST'});load()}};const drop=document.querySelector('#drop');drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');[...e.dataTransfer.files].forEach(async f=>{await fetch('/api/files/'+encodeURI(current?current+'/'+f.name:f.name),{method:'PUT',body:f});load()})};load();
</script></body></html>
