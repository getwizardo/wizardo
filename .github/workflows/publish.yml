name: Publish Build
on:
  push:
    tags:
      - 'v*'
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm run build
      - name: Push to builds remote
        run: |
          git remote add builds git@git.sr.ht:~lunalov2/wdo-builds
          git push builds master:$(echo ${GITHUB_REF#refs/tags/})
