[package]
name = "wizardo"
version = "2.0.0"
edition = "2021"
description = "A small, self-hosted cloud desktop with WebDAV support"
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
http = "1"
percent-encoding = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
